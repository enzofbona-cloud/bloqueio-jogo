function openProf(){const A=[0,1,2,3,4,5].map(i=>`${prof.ach["a"+i]?"✦":"·"} ${T("a"+i)}`).join("<br>");dl.innerHTML=`<b>${T("prof")}</b><p>${T("games")}: ${prof.games} · ${T("wins")}: ${prof.wins}<br>${T("rk")}: ${rate.elo} (${tier(rate.elo)}) · ${rate.w}/${rate.l}<br>${T("streak")}: ${T("days",curStreak())}</p><p style="text-align:left;color:var(--tx)">${T("ach")}<br>${A}</p><button onclick="dl.close()">${T("close")}</button>`;dl.showModal()}
const fdate=d=>new Date(d).toLocaleString(cfg.lang,{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function openHist(){RP=null;$("hl").innerHTML=hist.length?hist.map((h,i)=>`<button class="hi" onclick="openReplay(${i})"><span>${fdate(h.d)} · ${h.m==2?T("ranked"):h.m==3?T("daily"):h.m==4?T("blitz"):h.m==6?ot("cmFase",h.l):TA("lv")[h.l]}</span><span>${h.w==0?T("w"):T("l")} · ${T("moves",h.mv.length)}</span></button>`).join(""):`<p style="color:var(--mu);text-align:center;margin-top:30px">${T("nohist")}</p>`;show("hist")}
function rpState(i){const g=fresh();for(let k=0;k<i;k++){const e=RP.mv[k];put(g,e[0],dec(e))}return g}
function openReplay(i){const h=hist[i];if(!h)return;RP={mv:h.mv,i:h.mv.length,h,from:$("hist").classList.contains("on")};mode=9;busy=true;stack=[];lastW=null;hint=null;S=rpState(RP.i);setLabel();$("game").classList.add("rpl");ban();show("game");render()}
function rpGo(i){if(!RP)return;RP.i=Math.max(0,Math.min(RP.mv.length,i));S=rpState(RP.i);lastW=null;snd("click");render()}
$("r0").onclick=()=>rpGo(0);$("r1").onclick=()=>rpGo(RP.i-1);$("r2").onclick=()=>rpGo(RP.i+1);$("r3").onclick=()=>rpGo(RP.mv.length);
const leave=()=>{if(RP&&RP.from)openHist();else menu()};$("rx").onclick=leave;$("hb").onclick=menu;
$("bk").onclick=()=>{if(RP)leave();else menu()};
$("b1").onclick=()=>{if(!prof.tut&&!prof.games&&!askedTut){askedTut=true;dl.innerHTML=`<b>${T("ask")}</b><button onclick="dl.close();newGame(0)">${T("yesT")}</button><button onclick="dl.close();levels(1)">${T("skip")}</button>`;dl.showModal()}else levels(1)};
$("b4").onclick=()=>levels(4);$("b5").onclick=()=>newGame(3);$("bs").onclick=()=>openShop();$("bcol").onclick=()=>openColl();$("b3").onclick=()=>newGame(2);$("mt").onclick=()=>newGame(0);$("mh").onclick=openHist;$("mp").onclick=openProf;$("mset").onclick=openSet;

document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("button"))snd("click")});
applyLang();menu();
</script>
