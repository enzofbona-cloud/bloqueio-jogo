const AU=Object.assign({tok:null,ref:null,exp:0,uid:null,email:null,anon:true,prov:null},ld("sbauth",{}));

function auSet(r){AU.tok=r.access_token;AU.ref=r.refresh_token;AU.exp=Date.now()+Math.max(60,(r.expires_in||3600)-60)*1000;AU.uid=r.user.id;AU.email=r.user.email||null;AU.anon=!!r.user.is_anonymous;{const m=r.user.app_metadata||{},ids=(r.user.identities||[]).map(i=>i.provider);AU.prov=ids.includes("google")||m.provider=="google"||(m.providers||[]).includes("google")?"google":(m.provider||null)}auSave()}

async function api(path,o){o=o||{};const h={apikey:SB_KEY,"Content-Type":"application/json"};if(o.auth!==false&&AU.tok)h.Authorization="Bearer "+AU.tok;let r;

async function ensureAuth(){if(AU.tok&&Date.now()<AU.exp)return;
