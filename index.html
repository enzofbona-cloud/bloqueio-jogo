function clone(g){return{p:g.p.map(x=>x.slice()),w:g.w.slice(),H:new Map(g.H),V:new Map(g.V),t:g.t,over:g.over}}
function blk(g,r,c,r2,c2){if(r2!=r){const a=Math.min(r,r2);return g.H.has(K(a,c))||g.H.has(K(a,c-1))}const b=Math.min(c,c2);return g.V.has(K(r,b))||g.V.has(K(r-1,b))}
function moves(g,pl){const [r,c]=g.p[pl],o=g.p[1-pl],out=[];for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){const a=r+dr,b=c+dc;if(!inb(a,b)||blk(g,r,c,a,b))continue;if(a==o[0]&&b==o[1]){const a2=a+dr,b2=b+dc;if(inb(a2,b2)&&!blk(g,a,b,a2,b2))out.push([a2,b2]);else for(const [pr,pc] of dr?[[0,1],[0,-1]]:[[1,0],[-1,0]]){const a3=a+pr,b3=b+pc;if(inb(a3,b3)&&!blk(g,a,b,a3,b3))out.push([a3,b3])}}else out.push([a,b])}return out}
function dist(g,pl){const [r0,c0]=g.p[pl],d=new Int16Array(81).fill(-1),q=[[r0,c0]];d[r0*N+c0]=0;for(let k=0;k<q.length;k++){const [r,c]=q[k];if(r==GR(pl))return d[r*N+c];for(const [dr,dc] of[[1,0],[-1,0],[0,1],[0,-1]]){const a=r+dr,b=c+dc;if(!inb(a,b)||d[a*N+b]>=0||blk(g,r,c,a,b))continue;d[a*N+b]=d[r*N+c]+1;q.push([a,b])}}return -1}
function wallOK(g,t,r,c){if(r<0||c<0||r>7||c>7)return false;const k=K(r,c);if(g.H.has(k)||g.V.has(k))return false;if(t=="H"?(g.H.has(K(r,c-1))||g.H.has(K(r,c+1))):(g.V.has(K(r-1,c))||g.V.has(K(r+1,c))))return false;

function acts(g,pl){const a=moves(g,pl).map(m=>({m}));if(g.w[pl]>0)for(const t of["H","V"])for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(wallOK(g,t,r,c))a.push({w:[t,r,c]});return a}

function score(g,pl,a){const old=g.p[pl].slice();let M;if(a.m)g.p[pl]=a.m;else{M=a.w[0]=="H"?g.H:g.V;M.set(K(a.w[1],a.w[2]),pl)}

function best(g,pl,noise){let b=null,bs=-1e9;for(const a of acts(g,pl)){const s=score(g,pl,a)+(Math.random()-.5)*noise*2;if(s>bs){bs=s;b=a}}return b}
function pathCells(g,pl){const [r0,c0]=g.p[pl],par=new Int16Array(81).fill(-2),q=[[r0,c0]];par[r0*N+c0]=-1;let end=-1;
for(let k=0;k<q.length;k++){const [r,c]=q[k];if(r==GR(pl)){end=r*N+c;break}for(const [dr,dc] of[[1,0],[-1,0],[0,1],[0,-1]]){const a=r+dr,b=c+dc;if(!inb(a,b)||par[a*N+b]!=-2||blk(g,r,c,a,b))continue;par[a*N+b]=r*N+c;q.push([a,b])}}
const out=[];while(end>=0){out.push([(end/N)|0,end%N]);end=par[end]}return out}
function cands(g,pl){const a=moves(g,pl).map(m=>({m}));if(g.w[pl]>0){const seen=new Set();for(const [r,c] of pathCells(g,1-pl).slice(-9))for(let rr=r-1;rr<=r;rr++)for(let cc=c-1;cc<=c;cc++)for(const t of["H","V"]){const k=t+rr+","+cc;if(seen.has(k))continue;seen.add(k);if(wallOK(g,t,rr,cc))a.push({w:[t,rr,cc]})}}return a}
function ev(g){if(g.p[1][0]==8)return 1e4;if(g.p[0][0]==0)return -1e4;return (dist(g,0)-dist(g,1))*10+(g.w[1]-g.w[0])*.4}
function srch(g,pl,d,al,be){const cs=cands(g,pl);if(!cs.length)return ev(g);

function aiPick(){const L=LV[curLv()],noise=L.n*Math.max(.25,1.5-.07*turns),cs=cands(S,1);if(!cs.length)return null;const old=dist(S,1);

rpc("submit_move",{p_match:ON.mid,p_action:toTxt(toLoc(a))}).then(()=>{ON.sub=Math.max(0,ON.sub-1)}).catch(e=>{ON.sub=Math.max(0,ON.sub-1);bub("m",e.net?ot("err"):ot("bad"));onPull(true)});
doAct(0,a,()=>{if(ep!=ON.ep)return;if(a.w){prof.walls++;save("prof2",prof)}if(S.over!=null)return;if(finish())return;if(isBl())clk[0]+=2;busy=false;S.t=1;render()})}
function onSay(i){if(ON.mid)rpc("send_chat",{p_match:ON.mid,p_i:i}).catch(()=>{})}
function leaveNow(){const m=ON.mid;if(m)rpc("resign",{p_match:m}).catch(()=>{});save("bqm",null);S.over=1;menu()}
function onResign(){if(S.over!=null)return;if(ON.mid)rpc("resign",{p_match:ON.mid}).catch(()=>{});endGame(1,"res")}
/* --- pontos / menu --- */
const LG=[0,150,400,750,1200,1800],LGI=["🥉","🥈","🥇","💠","💎","👑"];
const lgIdx=t=>{let i=0;LG.forEach((v,k)=>{if(t>=v)i=k});return i};
const lgP=t=>{const i=lgIdx(t);return i>=5?1:(t-LG[i])/(LG[i+1]-LG[i])};
const lgN=i=>ot("lg")[i];
async function onElo(){if(!AU.uid)return;try{const q=await sel("profiles?id=eq."+AU.uid+"&select=elo,nickname,trophies,streak,best_streak");if(q&&q[0]){ON.elo=q[0].elo;ON.nick=q[0].nickname;ON.tr=q[0].trophies||0;ON.st=q[0].streak||0;ON.bst=q[0].best_streak||0;menuRt()}}catch(e){}}
function menuRt(){const t=ON.tr==null?0:ON.tr,i=lgIdx(t);$("rt").innerHTML=`${LGI[i]} ${lgN(i)} · 🏆 ${t}<i class="pbar"><b style="width:${Math.round(lgP(t)*100)}%"></b></i>`}
async function onEloInfo(){const el=$("eld");if(!el)return;try{const d=await rpc("sync_match",{p_match:ON.lastMid||ON.mid,p_ply:99999,p_chat:99999999});if(!d||!$("eld"))return;
if(d.kind=="friend"){$("eld").innerHTML=`<small>${ot("noTr")}</small>`;return}
const a=ON.my?d.award1:d.award0;if(!a)return;const b0=a.before,b1=a.trophies,i0=lgIdx(b0),i1=lgIdx(b1),tot=a.total;
let h=`<div class="aw"><div class="awn${tot<0?" neg":""}" id="awn">${tot>0?"+":""}0 🏆</div>`;
h+=`<div class="awl">${a.base>=0?ot("awW"):ot("awL")} ${a.base>0?"+":""}${a.base}</div>`;
if(a.streak>0)h+=`<div class="awl">🔥 ${ot("awS",a.wstreak)} +${a.streak}</div>`;
if(a.daily>0)h+=`<div class="awl">⭐ ${ot("awD")} +${a.daily}</div>`;
if(a.wstreak>=2&&a.streak==0)h+=`<div class="awl">🔥 ${ot("awS",a.wstreak)}</div>`;
if(i1>i0)h+=`<div class="awup">⬆ ${ot("up")} ${LGI[i1]} ${lgN(i1)}!</div>`;else if(i1<i0)h+=`<div class="awl">⬇ ${LGI[i1]} ${lgN(i1)}</div>`;
h+=`<div class="awl" style="margin-top:6px">${LGI[i1]} ${lgN(i1)} · 🏆 ${b1}</div><i class="pbar"><b id="awb" style="width:${Math.round((i0==i1?lgP(b0):0)*100)}%"></b></i>`;
h+=i1>=5?"":`<div class="awl" style="font-size:13px;opacity:.8">${ot("toNext",LG[i1+1]-b1,lgN(i1+1))}</div>`;h+=`</div>`;
$("eld").innerHTML=h;setTimeout(()=>{const b=$("awb");if(b)b.style.width=Math.round(lgP(b1)*100)+"%"},120);
let k=0;const iv=setInterval(()=>{k++;const v=Math.round(tot*k/20),e=$("awn");if(!e)return clearInterval(iv);e.textContent=(v>0?"+":"")+v+" 🏆";if(k>=20)clearInterval(iv)},40);
ON.tr=b1;ON.st=a.wstreak;menuRt();if(S&&0){}}catch(e){}}
async function onBoard(){onDlg(`<b>🏆 ${ot("board")}</b><p>${ot("conn")}</p>`);try{await ensureAuth();const d=await rpc("leaderboard",{});let h=`<b>🏆 ${ot("board")}</b>`;
if(!d.top.length)h+=`<p>${ot("emp")}</p>`;else{h+=`<div style="max-height:46vh;overflow:auto;margin:8px 0">`;d.top.forEach((r,k)=>{h+=`<div class="lbr${r.you?" me":""}"><span>${k+1}</span><span>${LGI[lgIdx(r.t)]} ${esc(r.n)}</span><span>🏆 ${r.t}</span></div>`});h+=`</div>`}
if(d.me!=null&&!d.top.some(r=>r.you))h+=`<p>${ot("pos",d.pos,d.total)} · 🏆 ${d.me}</p>`;
h+=`<button onclick="dl.close()">${ot("back")}</button>`;onDlg(h)}catch(e){onFail(e,"onBoard()")}}
/* --- conta --- */
const inp=(id,ph,type)=>`<input id="${id}" type="${type||"text"}" placeholder="${ph}" autocomplete="off" style="width:100%;padding:12px;margin-top:8px;background:#0f0a07;color:var(--tx);border:1px solid var(--gold);border-radius:6px;font:16px 'Cormorant Garamond',serif">`;
async function openAcct(){onDlg(`<b>${ot("acct")}</b><p>${ot("conn")}</p>`);try{await ensureAuth();await onElo()}catch(e){return onFail(e,"openAcct()")}
const st=AU.anon?ot("guest"):esc(AU.email||"");
const ti=ON.tr||0,li=lgIdx(ti);onDlg(`<b>${ot("acct")}</b><p>${st}</p><p>${LGI[li]} ${lgN(li)} · 🏆 ${ti} · 🔥 ${ON.st||0}<i class="pbar"><b style="width:${Math.round(lgP(ti)*100)}%"></b></i></p><button onclick="onBoard()">🏆 ${ot("board")}</button>${inp("an",ot("nick"))}<button onclick="acctNick()">${ot("nickS")}</button>${AU.anon?`<button onclick="acctForm('save')">${ot("save")}</button><button onclick="acctForm('login')">${ot("login")}</button>`:`<button onclick="acctLogout()">${ot("logout")}</button>`}<button onclick="acctDelAsk()">${ot("del")}</button><p><a href="${PRIV_URL}" target="_blank" rel="noopener" style="color:var(--g)">${ot("privacy")}</a></p><button onclick="dl.close()">${ot("back")}</button>`);if($("an"))$("an").value=ON.nick||""}
const PRIV_URL="#";
async function acctNick(){const v=($("an").value||"").trim();if(v.length<3||v.length>20)return;try{await ensureAuth();await api("/rest/v1/profiles?id=eq."+AU.uid,{method:"PATCH",body:{nickname:v}});ON.nick=v;bub("m",ot("ok"))}catch(e){bub("m",e.net?ot("err"):e.message)}}
function acctForm(k){onDlg(`<b>${ot(k=="save"?"save":"login")}</b>${inp("ae",ot("email"),"email")}${inp("ap",ot("pass"),"password")}<button onclick="acctGo('${k}')">${ot("go")}</button><button onclick="openAcct()">${ot("back")}</button>`)}
async function acctGo(k){const e=($("ae").value||"").trim(),p=$("ap").value||"";if(!e||p.length<8)return;try{await ensureAuth();
if(k=="save"){await api("/auth/v1/user",{method:"PUT",body:{email:e,password:p}});onDlg(`<b>${ot("acct")}</b><p>${ot("sent")}</p><button onclick="dl.close()">${ot("back")}</button>`)}
else{auSet(await api("/auth/v1/token?grant_type=password",{method:"POST",auth:false,body:{email:e,password:p}}));ON.elo=null;await onElo();menuRt();openAcct()}}catch(x){onFail(x,"acctForm('"+k+"')")}}
function acctLogout(){auClear();menuRt();dl.close()}
function acctDelAsk(){onDlg(`<b>${ot("del")}</b><p>${ot("delq")}</p><button onclick="acctDel()">${ot("delY")}</button><button onclick="openAcct()">${ot("cancel")}</button>`)}
async function acctDel(){try{await rpc("delete_my_account");auClear();save("bqm",null);menuRt();onDlg(`<b>${ot("bye")}</b><button onclick="dl.close()">${ot("back")}</button>`)}catch(e){onFail(e,"acctDelAsk()")}}
/* --- ligações com o menu do jogo --- */
const _menu=menu;menu=function(){if(ON.mid)ON.lastMid=ON.mid;onClean();_menu();$("b2s").textContent=ot("friend");menuRt();onElo();resumeBtn()};
function resumeBtn(){const m=ld("bqm",null);$("b6").style.display=m?"block":"none";$("b6t").textContent=ot("resume")}
const _op=openProf;openProf=function(){_op();dl.innerHTML=dl.innerHTML.replace('<button onclick="dl.close()">','<button onclick="openAcct()">'+ot("acct")+'</button><button onclick="dl.close()">')};
$("bk").onclick=()=>{if(RP)return leave();if(mode==5&&S.over==null){onDlg(`<b>${ot("leave")}</b><button onclick="dl.close();leaveNow()">${ot("leaveY")}</button><button onclick="dl.close()">${ot("stay")}</button>`);return}menu()};
$("b2").onclick=openOnlineMenu;$("b3").onclick=()=>onQueue("ranked");$("b4").onclick=()=>onQueue("blitz");$("b6").onclick=()=>{const m=ld("bqm",null);if(m)onStart(m,true)};
$("mp").onclick=openProf;$("b2s").textContent=ot("friend");menuRt();onElo();resumeBtn();
</script>
</body></html>
